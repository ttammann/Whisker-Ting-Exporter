# Generated by `ting-exporter rules` from src/ting_exporter/signals.py. Do not edit by hand:
# tests/test_signals.py fails when this file and the signal registry disagree.
#
# Evaluated at each aligned minute T with window (T-60s, T], stamped T. A minute without
# raw samples gets no rollup point. Minutes vmalert missed (VictoriaMetrics down, raw data
# that arrived late) are filled by the exporter's rollup repair from the same expressions.
groups:
  - name: ting_rollup_1m
    interval: 1m
    eval_delay: 60s
    rules:
      # voltage: ting_voltage_volts (V), stored every
      - record: ting:voltage_volts:min_1m
        expr: min_over_time(ting_voltage_volts[1m])
      - record: ting:voltage_volts:max_1m
        expr: max_over_time(ting_voltage_volts[1m])
      - record: ting:voltage_volts:avg_1m
        expr: round(avg_over_time(ting_voltage_volts[1m]), 0.0001)
      - record: ting:voltage_volts:count_1m
        expr: count_over_time(ting_voltage_volts[1m])
      # hifi: ting_hifi (1), stored every
      - record: ting:hifi:min_1m
        expr: min_over_time(ting_hifi[1m])
      - record: ting:hifi:max_1m
        expr: max_over_time(ting_hifi[1m])
      - record: ting:hifi:avg_1m
        expr: round(avg_over_time(ting_hifi[1m]), 0.01)
      # frequency: ting_frequency_hertz (Hz), stored every
      - record: ting:frequency_hertz:min_1m
        expr: min_over_time(ting_frequency_hertz[1m])
      - record: ting:frequency_hertz:max_1m
        expr: max_over_time(ting_frequency_hertz[1m])
      - record: ting:frequency_hertz:avg_1m
        expr: round(avg_over_time(ting_frequency_hertz[1m]), 0.00001)
      # thd: ting_thd_ratio (ratio), stored on_change(60 s)
      - record: ting:thd_ratio:avg_1m
        expr: round(avg_over_time(ting_thd_ratio[1m]), 0.00001)
      # thd_min: ting_thd_min_ratio (ratio), stored on_change(60 s)
      - record: ting:thd_min_ratio:min_1m
        expr: min_over_time(ting_thd_min_ratio[1m])
      # thd_max: ting_thd_max_ratio (ratio), stored on_change(60 s)
      - record: ting:thd_max_ratio:max_1m
        expr: max_over_time(ting_thd_max_ratio[1m])
