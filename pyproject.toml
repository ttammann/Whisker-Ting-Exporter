[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ting-exporter"
version = "3.0.0"
description = "Whisker Labs Ting sensor data (voltage, Hi-Fi, frequency, THD, outages) to VictoriaMetrics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Exact versions for the image are in requirements.lock. Two runtime dependencies (design 4.2).
dependencies = [
    "aiohttp>=3.9,<4",
    "msgpack>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2", "pycognito>=2024.5", "pyyaml>=6"]

[project.scripts]
ting-exporter = "ting_exporter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
pythonpath = ["src", "."]
markers = ["realvm: needs a real VictoriaMetrics and vmalert: the release binaries (TING_VM_BIN_DIR) or images (TING_VM_DOCKER)"]
